<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherion-systems</title>
    <link href="/src/css/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <header class="header-main">
      <!-- Menu -->
      <button
        class="btn btn-primary"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
      >
        ☰ Menu
      </button>

      <div
        class="offcanvas offcanvas-start sidebar-nexflow"
        tabindex="-1"
        id="sidebar"
        aria-labelledby="sidebarLabel"
      >
        <div class="offcanvas-header">
          <div class="brand">Aetherion</div>
          <button
            type="button"
            class="btn-close btn-close-black"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>

        <hr class="text-black" />

        <div class="offcanvas-body">
          <button class="btn btn-light menu-btn">Dashboard</button>
          <button class="btn btn-light menu-btn">Clientes</button>
          <button class="btn btn-light menu-btn">Projetos</button>
          <button class="btn btn-light menu-btn">Financeiro</button>
          <button class="btn btn-light menu-btn">Relatórios</button>
          <button class="btn btn-light menu-btn">Configurações</button>

          <nav class="navbar bg-body-tertiary pe-nav">
            <div class="container-fluid">
              <form class="d-flex" role="search">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Busca"
                  aria-label="Search"
                />
                <button class="btn btn-outline-success" type="submit">
                  Busca
                </button>
              </form>
            </div>
          </nav>
        </div>
      </div>

      <!-- Logo + Título -->
      <div class="title_main">
        <img
          src="src/images/A.svg"
          alt="Logo da Aetherion"
          class="logo_aetherion"
        />
        <h1>Aetherion Systems</h1>
      </div>

      <!-- Login -->
      <button
        id="loginButtonUser"
        type="button"
        class="btn btn-secondary"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Entrar
      </button>
    </header>
    <!-- Modal -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Login</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">
            <div class="dropdown login_user">
              <button
                class="btn btn-secondary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Entrar
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Cadastro</a></li>
                <li><a class="dropdown-item" href="#">Login</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="value-client">
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Total de clientes</h5>
          <div class="card-value-contador-total-clientes">
            <h3 id="cont_client">10</h3>
          </div>
          <!-- <button onclick="addClientes()">+ Cliente</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Projetos ativos</h5>
          <div class="card-value-contador-projetos-ativos">
            <h3 id="cont_proj">2</h3>
          </div>
          <!-- <button onclick="addProjetos()">+ Projeto</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Faturamento</h5>
          <div class="card-value-contador-faturamento">
            <h3 id="cont_fat">1</h3>
          </div>
          <!-- <button onclick="addFaturamento()">+ 100</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Empregados</h5>
          <div class="card-value-contador-empregados">
            <h3 id="cont_emp">2</h3>
          </div>
          <!-- <button onclick="addEmpregados()">+ Funcionário</button> -->
        </div>
      </div>
    </div>
    <div class="dashboard-card mt-4">

  <h5 class="dashboard-title">Visão Geral</h5>

  <div class="dashboard-body">

    <div class="dashboard-chart-wrapper">
      <canvas id="dashboardChart"></canvas>
    </div>

    <div class="dashboard-online-wrapper">

      <div class="dashboard-online-body">
        <!-- espaço reservado -->
      </div>

      <div class="dashboard-online-card">
        <h5 class="dashboard-online-title">Online</h5>
        <canvas id="dashboardChart-online"></canvas>
      </div>

    </div>

  </div>
</div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/src/script/app.js" defer></script>
    
  </body>
</html>
