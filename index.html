<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherion-systems</title>
    <link href="/src/css/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <header class="header-main">
      <!-- Menu -->
      <button
        class="btn btn-primary"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
      >
        ☰ Menu
      </button>

      <div
        class="offcanvas offcanvas-start sidebar-nexflow"
        tabindex="-1"
        id="sidebar"
        aria-labelledby="sidebarLabel"
      >
        <div class="offcanvas-header">
          <div class="brand">Aetherion</div>
          <button
            type="button"
            class="btn-close btn-close-black"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>

        <hr class="text-black" />

        <div class="offcanvas-body">
          <button class="btn btn-light menu-btn">
            <a href="src/html/projetos/projetos.html">Projetos</a>
          </button>
          <button class="btn btn-light menu-btn">
            <a href="src/html/cliente/client.html">Clientes</a>
          </button>
          <button class="btn btn-light menu-btn">
            <a href="src/html/colaboradores/colaboradores.html">Colaboradores</a>
          </button>
          <button class="btn btn-light menu-btn">
            <a href="src/html/Finanças/financeiro.html">Financeiro</a>
          </button>
          <button class="btn btn-light menu-btn">
            <a href="src/html/Relatórios/relatorios.html">Relatórios</a>
          </button>
          <button class="btn btn-light menu-btn">
            <a href="src/html/configurações/configuracoes.html">Configurações</a>
          </button>

          <nav class="navbar bg-body-tertiary pe-nav">
            <div class="container-fluid">
              <form class="d-flex" role="search">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Busca"
                  aria-label="Search"
                />
                <button class="btn btn-outline-success" type="submit">
                  Busca
                </button>
              </form>
            </div>
          </nav>
        </div>
      </div>

      <!-- Logo + Título -->
      <div class="title_main">
        <img
          src="src/images/A.svg"
          alt="Logo da Aetherion"
          class="logo_aetherion"
        />
        <h1 class="title_main_As">Aetherion Systems</h1>
      </div>

      <!-- Login -->
      <button
        id="loginButtonUser"
        type="button"
        class="btn btn-secondary"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Entrar
      </button>
    </header>
    <!-- Modal do login-->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Conta</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">
            <div class="dropdown login_user">
              <li class="dropdown-item-User" ><input id="email_login" type="email" placeholder="Email"></li>
              <li class="dropdown-item-Password" ><input id="password_login" type="password" placeholder="Senha">
              <button class="ver_Senha" id="password_show"><img src="/src/images/view.png" alt="verSenha"></button>
              </li> 

              <button id="button_login" class="btn btn-primary button_login_cd">Logar</button>
            
              <!-- AQUI FAÇO A FUNÇÃO DE CADASTRO APÓS -->
               <button type="button" id="button_cadastro" class="btn btn-primary button_cadastro" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
  Cadastro
</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="value-client">
      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Total de clientes</h5>
          <div class="card-value-contador-total-clientes">
            <h3 id="cont_client">10</h3>
          </div>
          <!-- <button onclick="addClientes()">+ Cliente</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Projetos ativos</h5>
          <div class="card-value-contador-projetos-ativos">
            <h3 id="cont_proj">2</h3>
          </div>
          <!-- <button onclick="addProjetos()">+ Projeto</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Faturamento</h5>
          <div class="card-value-contador-faturamento">
            <h3 id="cont_fat">1</h3>
          </div>
          <!-- <button onclick="addFaturamento()">+ 100</button> -->
        </div>
      </div>

      <div class="card" style="width: 18rem">
        <div class="card-body">
          <h5 class="card-title">Colaboradores</h5>
          <div class="card-value-contador-empregados">
            <h3 id="cont_emp">2</h3>
          </div>
          <!-- <button onclick="addEmpregados()">+ Funcionário</button> -->
        </div>
      </div>
    </div>
    <div class="dashboard-card mt-4">
      <h5 class="dashboard-title">Visão Geral</h5>

      <div class="dashboard-body">
        <div class="dashboard-chart-wrapper">
          <h5 class="dashboardChart-Title">Dados</h5>
          <canvas id="dashboardChart"></canvas>
        </div>

        <div class="dashboard-online-wrapper">
          <div class="dashboard-online-body">
            <!-- espaço reservado -->
          </div>

          <div class="dashboard-online-card">
            <h5 class="dashboard-online-title">Empregados Ativos</h5>
            <canvas id="dashboardChart-online"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/src/script/app.js" defer></script>
    <!-- Button trigger modal -->


<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5 " id="staticBackdropLabel button_cadastro">Cadastro</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body cadastro">
        <input id="input_cadastro" placeholder=" Nome" type="text">
        <input id="input_cadastro" type="email" name="email" id="email_cadastro" placeholder=" Email">
      <input id="input_cadastro" placeholder=" Senha" type="text">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Confirmar</button>
      </div>
    </div>
  </div>
</div>
  </body>
</html>
