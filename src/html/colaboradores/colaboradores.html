<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colaboradores</title>
    <script src="colaboradores.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="title-pages">
      <div class="title_main">
        <img
          src="/src/images/A.svg"
          alt="Logo da Aetherion"
          class="logo_aetherion"
        />
        <h1 class="title_main_As">Colaboradores</h1>
        <h2 class="Home-tittle"><a href="/index.html">Home</a></h2>
      </div>
    </div>
    <div class="conteudoMain">
      <div class="input-clientes">
        
        <button
        id="loginButtonUser"
        type="button"
        class="btn btn-secondary"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Adicionar Colaborador
      </button>
       <!-- <button
        id="loginButtonUser"
        type="button"
        class="btn btn-secondary"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Remover Cliente
      </button> -->
    </header>
    <!-- Modal do login-->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Adicionar Colaborador</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">
            <div class="dropdown login_user">
              <li class="dropdown-item-User" ><input id="name_client" type="text" placeholder="Nome"></li>
              <li class="dropdown-item-User" ><input id="number_client" type="number" placeholder="Telefone   Ex: (12) 90000-0000"></li>
              <li class="dropdown-item-User" ><input id="email_client" type="email" placeholder="Email para contato"></li>
              <!-- <li class="dropdown-item-Password" ><input id="password_client" type="password" placeholder="Token">  FUTURA IDEIA DE TOKEN -->
              <!-- <button class="ver_Senha" id="password_show"><img src="/src/images/view.png" alt="verSenha"></button> -->
              </li> 

              <button id="button_login" class="btn btn-primary button_login_cd">Adicionar Colaborador</button>
              
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>
    </div>
    <div class="table-client">
  <table class="table-test">
    <thead class="table-02">
      <tr >
        <th>Colaborador</th>
        <th>Contato</th>
        <th>Email</th>
      </tr>
    </thead>

    <tbody id="clientesTable">
      
    </tbody>
  </table>
</div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
